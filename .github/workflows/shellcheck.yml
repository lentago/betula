# ============================================================================
# ShellCheck — Static Analysis
# ============================================================================
# Thin wrapper around lentago/shared-workflows/shellcheck.yml.
# Required status check for branch protection / auto-merge.
# ============================================================================

name: ShellCheck

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  shellcheck:
    uses: lentago/shared-workflows/.github/workflows/shellcheck.yml@v1.2.3
    with:
      scripts: |
        deploy.sh
        scripts/start_log_shipping.sh
        scripts/gitops-sync.sh
        scripts/bootstrap.sh
        scripts/fluent_bit_healthcheck.sh
        scripts/rotate_logs.sh
        scripts/device_inventory_publish.sh
